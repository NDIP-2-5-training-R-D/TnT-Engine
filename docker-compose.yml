services:
  openbao:
    image: quay.io/openbao/openbao:2.0.0
    command: bao server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao-init:
    image: curlimages/curl:latest
    depends_on:
      openbao:
        condition: service_healthy
    volumes:
      - ./infra/openbao/init-scripts:/scripts
    command: sh -c "tr -d '\r' < /scripts/01-init-openbao.sh > /tmp/init.sh && sh /tmp/init.sh"
    restart: on-failure

  crypto-adapter:
    build: .
    ports:
      - "8300:8300"
    depends_on:
      openbao:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
