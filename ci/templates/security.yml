# Reusable security scanning templates.
# Covers: SAST, dependency audit, container image scan.

.sast_scan:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: "pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .pip-cache/
  script:
    - pip install --quiet bandit
    - echo "=== SAST (Bandit) ==="
    - bandit -r src/ -f json -o bandit-report.json --severity-level medium || true
    - bandit -r src/ --severity-level high
  artifacts:
    when: always
    paths:
      - bandit-report.json
  allow_failure: false

.dependency_scan:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: "pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .pip-cache/
  script:
    - pip install --quiet pip-audit
    - echo "=== Dependency audit ==="
    - pip-audit --requirement <(pip freeze) --format json --output dep-audit.json || true
    - pip-audit --requirement <(pip freeze)
  artifacts:
    when: always
    paths:
      - dep-audit.json

.container_scan:
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      echo "=== Container scan (Trivy) ==="
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy:latest image \
        --severity HIGH,CRITICAL \
        --exit-code 0 \
        --format json \
        --output /dev/stdout \
        "${IMAGE}" | tee trivy-report.json

      # Fail on CRITICAL vulnerabilities only
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy:latest image \
        --severity CRITICAL \
        --exit-code 1 \
        "${IMAGE}"
  artifacts:
    when: always
    paths:
      - trivy-report.json
  allow_failure: false
