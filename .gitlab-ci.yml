# ═══════════════════════════════════════════════════════════════════════
# T&T Engine — GitLab CI/CD Pipeline (Helm-based)
# ═══════════════════════════════════════════════════════════════════════
#
# Pipeline flow:
#   Feature branch:  validate + security → stops (no deploy)
#   main branch:     validate → security → build → scan
#                       → deploy_dev → verify → deploy_staging → verify
#   git tag (v*):    validate → security → build → scan
#                       → deploy_prod (MANUAL) → verify
#
# Deployment: Helm upgrade --install --atomic (auto-rollback on failure)
# Rollback:   One-click manual job via Helm rollback
#
# Future services: include ci/templates/*.yml and override SERVICE_NAME.
# ═══════════════════════════════════════════════════════════════════════

include:
  - local: ci/templates/validate.yml
  - local: ci/templates/security.yml
  - local: ci/templates/docker.yml
  - local: ci/templates/db-migrate.yml
  - local: ci/templates/deploy.yml
  - local: ci/templates/post-deploy.yml

variables:
  SERVICE_NAME: "tnt-engine"
  NAMESPACE: "tnt-engine"

stages:
  - validate
  - security
  - build
  - scan
  - deploy_dev
  - deploy_staging
  - deploy_prod
  - post_deploy

# ═══════════════════════════════════════════════════════════════════════
# STAGE: VALIDATE (parallel — lint, typecheck, test)
# ═══════════════════════════════════════════════════════════════════════

lint:
  extends: .lint
  stage: validate

typecheck:
  extends: .typecheck
  stage: validate

test:
  extends: .unit_test
  stage: validate

# ═══════════════════════════════════════════════════════════════════════
# STAGE: SECURITY (parallel — SAST, dependency audit)
# ═══════════════════════════════════════════════════════════════════════

sast:
  extends: .sast_scan
  stage: security

dependency_audit:
  extends: .dependency_scan
  stage: security

# ═══════════════════════════════════════════════════════════════════════
# STAGE: BUILD (Docker image → GitLab Container Registry)
# ═══════════════════════════════════════════════════════════════════════

build_image:
  extends: .docker_build
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ═══════════════════════════════════════════════════════════════════════
# STAGE: SCAN (container vulnerability scan)
# ═══════════════════════════════════════════════════════════════════════

container_scan:
  extends: .container_scan
  stage: scan
  needs: ["build_image"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ═══════════════════════════════════════════════════════════════════════
# DEPLOY: DEV (auto on main)
# ═══════════════════════════════════════════════════════════════════════

migrate_dev:
  extends: .db_migrate
  stage: deploy_dev
  needs: ["build_image"]
  variables:
    TNT_DB_HOST: $DEV_DB_HOST
    TNT_DB_USER: $DEV_DB_USER
    TNT_DB_PASSWORD: $DEV_DB_PASSWORD
    TNT_DB_NAME: $DEV_DB_NAME
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_dev:
  extends: .deploy_base
  stage: deploy_dev
  needs: ["migrate_dev", "container_scan"]
  variables:
    KUBE_CONTEXT: $DEV_KUBE_CONTEXT
    HELM_VALUES: "./helm/values-dev.yaml"
    TNT_DB_USER: $DEV_DB_USER
    TNT_DB_PASSWORD: $DEV_DB_PASSWORD
    TNT_CRYPTO_TOKEN: $DEV_CRYPTO_TOKEN
  environment:
    name: dev
    url: https://tnt-engine.dev.internal
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

verify_dev:
  extends: .health_check
  stage: post_deploy
  needs: ["deploy_dev"]
  variables:
    KUBE_CONTEXT: $DEV_KUBE_CONTEXT
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ═══════════════════════════════════════════════════════════════════════
# DEPLOY: STAGING (auto on main, after dev succeeds)
# ═══════════════════════════════════════════════════════════════════════

migrate_staging:
  extends: .db_migrate
  stage: deploy_staging
  needs: ["verify_dev"]
  variables:
    TNT_DB_HOST: $STAGING_DB_HOST
    TNT_DB_USER: $STAGING_DB_USER
    TNT_DB_PASSWORD: $STAGING_DB_PASSWORD
    TNT_DB_NAME: $STAGING_DB_NAME
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_staging:
  extends: .deploy_base
  stage: deploy_staging
  needs: ["migrate_staging"]
  variables:
    KUBE_CONTEXT: $STAGING_KUBE_CONTEXT
    HELM_VALUES: "./helm/values-staging.yaml"
    TNT_DB_USER: $STAGING_DB_USER
    TNT_DB_PASSWORD: $STAGING_DB_PASSWORD
    TNT_CRYPTO_TOKEN: $STAGING_CRYPTO_TOKEN
  environment:
    name: staging
    url: https://tnt-engine.staging.internal
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

verify_staging:
  extends: .health_check
  stage: post_deploy
  needs: ["deploy_staging"]
  variables:
    KUBE_CONTEXT: $STAGING_KUBE_CONTEXT
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ═══════════════════════════════════════════════════════════════════════
# DEPLOY: PRODUCTION (manual gate, tags only)
# ═══════════════════════════════════════════════════════════════════════

migrate_prod:
  extends: .db_migrate
  stage: deploy_prod
  variables:
    TNT_DB_HOST: $PROD_DB_HOST
    TNT_DB_USER: $PROD_DB_USER
    TNT_DB_PASSWORD: $PROD_DB_PASSWORD
    TNT_DB_NAME: $PROD_DB_NAME
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: false

deploy_prod:
  extends: .deploy_base
  stage: deploy_prod
  needs: ["migrate_prod"]
  variables:
    KUBE_CONTEXT: $PROD_KUBE_CONTEXT
    HELM_VALUES: "./helm/values-prod.yaml"
    TNT_DB_USER: $PROD_DB_USER
    TNT_DB_PASSWORD: $PROD_DB_PASSWORD
    TNT_CRYPTO_TOKEN: $PROD_CRYPTO_TOKEN
    DEPLOY_TIMEOUT: "300s"
  environment:
    name: production
    url: https://tnt-engine.internal
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: false

verify_prod:
  extends: .health_check
  stage: post_deploy
  needs: ["deploy_prod"]
  variables:
    KUBE_CONTEXT: $PROD_KUBE_CONTEXT
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG

# ═══════════════════════════════════════════════════════════════════════
# ROLLBACK (manual one-click — Helm rollback to previous revision)
# ═══════════════════════════════════════════════════════════════════════

rollback_dev:
  extends: .rollback
  stage: post_deploy
  variables:
    KUBE_CONTEXT: $DEV_KUBE_CONTEXT
  environment:
    name: dev
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

rollback_staging:
  extends: .rollback
  stage: post_deploy
  variables:
    KUBE_CONTEXT: $STAGING_KUBE_CONTEXT
  environment:
    name: staging
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

rollback_prod:
  extends: .rollback
  stage: post_deploy
  variables:
    KUBE_CONTEXT: $PROD_KUBE_CONTEXT
  environment:
    name: production
    action: stop
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

# ═══════════════════════════════════════════════════════════════════════
# EXTENSION: Adding a new service
# ═══════════════════════════════════════════════════════════════════════
#
# New service repos include these shared templates:
#
#   include:
#     - project: 'geic/tnt-engine'
#       ref: main
#       file:
#         - ci/templates/validate.yml
#         - ci/templates/docker.yml
#         - ci/templates/deploy.yml
#         - ci/templates/post-deploy.yml
#
#   variables:
#     SERVICE_NAME: "my-new-service"
#     NAMESPACE: "my-new-service"
#
# Each service gets the same quality gates, Helm deploy, and rollback.
# ═══════════════════════════════════════════════════════════════════════
