# Reusable post-deploy verification template.
# Runs health checks and basic smoke tests after deployment.

.health_check:
  image:
    name: bitnami/kubectl:1.29
    entrypoint: [""]
  variables:
    NAMESPACE: "tnt-engine"
    HEALTH_RETRIES: "10"
    HEALTH_INTERVAL: "5"
  script:
    - kubectl config use-context "${KUBE_CONTEXT}"

    # Wait for all pods to be ready
    - |
      echo "=== Waiting for pods ==="
      kubectl -n "${NAMESPACE}" wait --for=condition=ready pod \
        -l "app=${SERVICE_NAME}" \
        --timeout=60s

    # Get a pod to run health check
    - |
      POD=$(kubectl -n "${NAMESPACE}" get pod -l "app=${SERVICE_NAME}" \
        -o jsonpath='{.items[0].metadata.name}')
      echo "Health checking via pod: ${POD}"

    # Retry health check
    - |
      for i in $(seq 1 ${HEALTH_RETRIES}); do
        STATUS=$(kubectl -n "${NAMESPACE}" exec "${POD}" -- \
          python -c "
      import urllib.request, json
      resp = urllib.request.urlopen('http://localhost:8000/api/v1/health')
      data = json.loads(resp.read())
      print(json.dumps(data))
      " 2>/dev/null) && break
        echo "Attempt ${i}/${HEALTH_RETRIES} failed, retrying in ${HEALTH_INTERVAL}s..."
        sleep "${HEALTH_INTERVAL}"
      done

    - |
      echo "Health check response: ${STATUS}"
      echo "${STATUS}" | python3 -c "
      import sys, json
      data = json.load(sys.stdin)
      if data.get('status') != 'ok':
          print('FAIL: health check returned non-ok status')
          sys.exit(1)
      cb = data.get('circuit_breaker', 'UNKNOWN')
      if cb == 'OPEN':
          print('WARNING: circuit breaker is OPEN')
          sys.exit(1)
      print(f'OK: status={data[\"status\"]}, circuit_breaker={cb}')
      "

    - echo "=== Post-deploy verification passed ==="

# ─────────────────────────────────────────────────────────────────────
# Smoke test — exercises real API surface on the deployed k8s pod:
#   1. GET  /api/v1/ready      — readiness probe must return ready=true
#   2. POST /api/v1/tokenize   — tokenize a synthetic value
#   3. POST /api/v1/detokenize — round-trip must return the same value
#
# Runs in-cluster via `kubectl exec` (same style as .health_check) so it
# needs no ingress, no public DNS, and no extra secrets. Uses a
# throwaway tenant id scoped to the CI pipeline run.
# ─────────────────────────────────────────────────────────────────────
.k8s_smoke_test:
  image:
    name: bitnami/kubectl:1.29
    entrypoint: [""]
  variables:
    NAMESPACE: "tnt-engine"
    SMOKE_TENANT_ID: "ci-smoke-${CI_PIPELINE_ID}"
    SMOKE_FIELD: "email"
    SMOKE_VALUE: "smoke-test@tnt-engine.local"
  script:
    - kubectl config use-context "${KUBE_CONTEXT}"

    - |
      echo "=== Selecting pod for smoke test ==="
      kubectl -n "${NAMESPACE}" wait --for=condition=ready pod \
        -l "app=${SERVICE_NAME}" \
        --timeout=60s
      POD=$(kubectl -n "${NAMESPACE}" get pod -l "app=${SERVICE_NAME}" \
        -o jsonpath='{.items[0].metadata.name}')
      echo "Smoke testing via pod: ${POD}"

    - |
      echo "=== [1/3] Readiness probe ==="
      kubectl -n "${NAMESPACE}" exec "${POD}" -- python -c "
      import json, sys, urllib.request
      resp = urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=5)
      data = json.loads(resp.read())
      if not data.get('ready'):
          print(f'FAIL: service not ready: {data}')
          sys.exit(1)
      print(f'OK: ready={data[\"ready\"]}')
      "

    - |
      echo "=== [2/3] Tokenize round-trip ==="
      kubectl -n "${NAMESPACE}" exec "${POD}" \
        -e "SMOKE_TENANT_ID=${SMOKE_TENANT_ID}" \
        -e "SMOKE_FIELD=${SMOKE_FIELD}" \
        -e "SMOKE_VALUE=${SMOKE_VALUE}" \
        -- python -c "
      import json, os, sys, urllib.request
      tenant = os.environ['SMOKE_TENANT_ID']
      field  = os.environ['SMOKE_FIELD']
      value  = os.environ['SMOKE_VALUE']

      def post(path, payload):
          req = urllib.request.Request(
              f'http://localhost:8000{path}',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              return json.loads(resp.read())

      tok = post('/api/v1/tokenize', {
          'value': value, 'field': field, 'tenant_id': tenant,
      })
      if not tok.get('token'):
          print(f'FAIL: tokenize returned no token: {tok}')
          sys.exit(1)
      if tok['token'] == value:
          print('FAIL: token equals plaintext — tokenization is a no-op')
          sys.exit(1)
      print(f'OK: tokenize -> token={tok[\"token\"][:12]}... cached={tok.get(\"cached\")}')

      det = post('/api/v1/detokenize', {
          'token': tok['token'], 'tenant_id': tenant,
      })
      if det.get('value') != value:
          print(f'FAIL: detokenize mismatch: got={det.get(\"value\")!r} want={value!r}')
          sys.exit(1)
      print(f'OK: detokenize -> value matches original')
      "

    - |
      echo "=== [3/3] Tenant isolation ==="
      kubectl -n "${NAMESPACE}" exec "${POD}" \
        -e "SMOKE_TENANT_ID=${SMOKE_TENANT_ID}" \
        -e "SMOKE_FIELD=${SMOKE_FIELD}" \
        -e "SMOKE_VALUE=${SMOKE_VALUE}" \
        -- python -c "
      import json, os, sys, urllib.error, urllib.request
      tenant = os.environ['SMOKE_TENANT_ID']
      field  = os.environ['SMOKE_FIELD']
      value  = os.environ['SMOKE_VALUE']

      def post(path, payload):
          req = urllib.request.Request(
              f'http://localhost:8000{path}',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          return urllib.request.urlopen(req, timeout=10)

      tok = json.loads(post('/api/v1/tokenize', {
          'value': value, 'field': field, 'tenant_id': tenant,
      }).read())['token']

      # Detokenize with a different tenant must NOT succeed.
      try:
          post('/api/v1/detokenize', {
              'token': tok, 'tenant_id': tenant + '-other',
          })
      except urllib.error.HTTPError as e:
          if e.code in (401, 403, 404):
              print(f'OK: cross-tenant detokenize denied with HTTP {e.code}')
              sys.exit(0)
          print(f'FAIL: unexpected HTTP {e.code} on cross-tenant detokenize')
          sys.exit(1)
      print('FAIL: cross-tenant detokenize unexpectedly succeeded')
      sys.exit(1)
      "

    - echo "=== K8s smoke test passed ==="
