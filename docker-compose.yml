services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tnt_engine
      POSTGRES_USER: tnt
      POSTGRES_PASSWORD: tnt_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao:
    image: quay.io/openbao/openbao:latest
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-token
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      BAO_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200"
    command: server -dev
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  # Kafka — single-node KRaft (no Zookeeper) durability sink for audit logs.
  # Uses the official apache/kafka image (bitnami archived their free catalog).
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      # KRaft config — single combined controller+broker node
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Auto-create the audit topic on first publish
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # KRaft requires a cluster id; any 22-char base64 URL-safe string works.
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # T&T Engine — the Python app itself
  tnt-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      TNT_DB_HOST: postgres
      TNT_DB_PORT: "5432"
      TNT_DB_NAME: tnt_engine
      TNT_DB_USER: tnt
      TNT_DB_PASSWORD: tnt_secret
      TNT_REDIS_URL: "redis://redis:6379/0"
      TNT_CRYPTO_BASE_URL: "http://openbao:8200/v1"
      TNT_CRYPTO_TOKEN: "dev-token"
      TNT_VAULT_AUTH_METHOD: "static"
      TNT_CRYPTO_BACKEND: "openbao"
      TNT_CRYPTO_VERIFY_SSL: "false"
      TNT_ENVIRONMENT: "development"
      TNT_KAFKA_ENABLED: "true"
      TNT_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      TNT_KAFKA_AUDIT_TOPIC: "tnt.audit"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # control-plane:  # uncomment to run in Docker (currently running locally on port 3100)
  #   build:
  #     context: ./control-plane
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3100:3100"
