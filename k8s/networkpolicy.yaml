# Network policy: restrict traffic to only what's needed.
# tnt-engine can:
#   - receive from ingress controller
#   - connect to postgres, redis, openbao (within namespace)
#   - nothing else
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tnt-engine
  namespace: tnt-engine
spec:
  podSelector:
    matchLabels:
      app: tnt-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
  egress:
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    # OpenBao
    - to:
        - podSelector:
            matchLabels:
              app: openbao
      ports:
        - port: 8200
    # DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
