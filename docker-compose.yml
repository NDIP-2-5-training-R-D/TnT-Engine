  #     AUTH_PROVIDER: "credentials"
  #     WATCHPACK_POLLING: "true"
  #     PG_HOST: "postgres"
  #     PG_PORT: "5432"
  #     REDIS_HOST: "redis"
  #     REDIS_PORT: "6379"
  #     KAFKA_HOST: "kafka"
  #     KAFKA_PORT: "9092"
  #   volumes:
  #     - ./control-plane:/app
  #     - /app/node_modules
  #     - /app/.next
  #   depends_on:
  #     openbao:
  #       condition: service_started
  #     tnt-engine:
  #       condition: service_started

  # SoftHSM2 — only starts with: docker compose --profile hsm up
  softhsm:
    profiles: ["hsm"]
    build:
      context: .
      dockerfile: Dockerfile.softhsm
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    environment:
      SOFTHSM2_CONF: /etc/softhsm/softhsm2.conf

volumes:
  pgdata:
  softhsm-tokens:
  kafka-data:
