# Non-secret configuration — environment-specific values injected at deploy time.
# Secrets (passwords, tokens) go in secrets.yaml or external vault.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tnt-engine-config
  namespace: tnt-engine
data:
  # PostgreSQL
  TNT_DB_HOST: "postgres.tnt-engine.svc.cluster.local"
  TNT_DB_PORT: "5432"
  TNT_DB_NAME: "tnt_engine"
  TNT_DB_POOL_MIN: "10"
  TNT_DB_POOL_MAX: "50"
  TNT_DB_STATEMENT_TIMEOUT_MS: "10000"

  # Read replica (empty = use primary)
  TNT_DB_READ_HOST: ""

  # Redis
  TNT_REDIS_URL: "redis://redis.tnt-engine.svc.cluster.local:6379/0"
  TNT_REDIS_TOKEN_TTL_SECONDS: "3600"
  TNT_REDIS_MAX_CONNECTIONS: "50"
  TNT_REDIS_SOCKET_TIMEOUT_SECONDS: "2.0"
  TNT_REDIS_CONNECT_TIMEOUT_SECONDS: "3.0"

  # L1 in-memory cache
  TNT_L1_MAX_SIZE: "10000"
  TNT_L1_TTL_SECONDS: "300"

  # OpenBao / Vault
  TNT_CRYPTO_BASE_URL: "http://openbao.tnt-engine.svc.cluster.local:8200/v1"
  TNT_CRYPTO_TRANSIT_KEY: "tnt-key"
  TNT_CRYPTO_HMAC_KEY: "tnt-hmac"
  TNT_CRYPTO_TIMEOUT_SECONDS: "5.0"
  TNT_CRYPTO_MAX_RETRIES: "3"

  # Circuit breaker
  TNT_CB_FAILURE_THRESHOLD: "5"
  TNT_CB_RECOVERY_TIMEOUT_SECONDS: "30.0"
  TNT_CB_HALF_OPEN_MAX_CALLS: "3"

  # Service
  TNT_TOKEN_PREFIX: "tok_"
  TNT_TOKEN_LENGTH: "32"
  TNT_DEDUP_TTL_SECONDS: "3600"

  # Workers
  TNT_WORKER_CLEANUP_INTERVAL_SECONDS: "60"
  TNT_WORKER_CLEANUP_BATCH_SIZE: "1000"
  TNT_WORKER_REENCRYPT_BATCH_SIZE: "500"
  TNT_WORKER_CACHE_REBUILD_BATCH_SIZE: "2000"
