# DEVELOPMENT ONLY — do NOT use in staging or production.
# In staging/production, use External Secrets Operator to pull
# secrets from OpenBao/Vault at runtime. See:
#   helm/tnt-engine/templates/external-secret.yaml
#   helm/values-prod.yaml (externalSecrets section)
apiVersion: v1
kind: Secret
metadata:
  name: tnt-engine-secrets
  namespace: tnt-engine
  labels:
    environment: development
    warning: "NOT-FOR-PRODUCTION"
type: Opaque
stringData:
  TNT_DB_USER: "tnt"
  TNT_DB_PASSWORD: "REPLACE_WITH_VAULT_SECRET"
  TNT_CRYPTO_TOKEN: "REPLACE_WITH_VAULT_SECRET"
  TNT_ENVIRONMENT: "development"
