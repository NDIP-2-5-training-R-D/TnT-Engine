{{- if .Values.externalSecrets.enabled }}
# ExternalSecret CRD — pulls secrets from OpenBao/Vault at runtime.
# Requires the External Secrets Operator to be installed in the cluster.
# Docs: https://external-secrets.io/latest/provider/hashicorp-vault/
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "tnt-engine.fullname" . }}
  labels:
    {{- include "tnt-engine.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "tnt-engine.fullname" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
