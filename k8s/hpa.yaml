# Horizontal Pod Autoscaler — scales based on CPU and request rate.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tnt-engine
  namespace: tnt-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tnt-engine
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30          # react fast
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60                    # add up to 4 pods/min
    scaleDown:
      stabilizationWindowSeconds: 300          # cool down slowly
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120                   # remove up to 2 pods/2min
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Custom metric: scale on request rate via Prometheus adapter
    - type: Pods
      pods:
        metric:
          name: tnt_http_requests_per_second
        target:
          type: AverageValue
          averageValue: "500"                  # 500 req/s per pod
