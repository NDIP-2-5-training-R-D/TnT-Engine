services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tnt_engine
      POSTGRES_USER: tnt
      POSTGRES_PASSWORD: tnt_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao:
    image: quay.io/openbao/openbao:latest
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-token
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    command: server -dev
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Kafka (KRaft mode — no Zookeeper) — only starts with: docker compose --profile kafka up
  kafka:
    profiles: ["kafka"]
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      # KRaft — single node combined broker + controller
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic auto-creation + retention
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"   # 7 days
      KAFKA_CFG_LOG_SEGMENT_BYTES: "104857600"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/bitnami/kafka

  # T&T Engine — the Python app itself
  tnt-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      TNT_DB_HOST: postgres
      TNT_DB_PORT: "5432"
      TNT_DB_NAME: tnt_engine
      TNT_DB_USER: tnt
      TNT_DB_PASSWORD: tnt_secret
      TNT_REDIS_URL: "redis://redis:6379/0"
      TNT_CRYPTO_BASE_URL: "http://openbao:8200/v1"
      TNT_CRYPTO_TOKEN: "dev-token"
      TNT_VAULT_AUTH_METHOD: "static"
      TNT_CRYPTO_BACKEND: "openbao"
      TNT_CRYPTO_VERIFY_SSL: "false"
      TNT_ENVIRONMENT: "development"
      # Kafka audit — set TNT_AUDIT_BACKEND=kafka to enable
      # (requires: docker compose --profile kafka up)
      TNT_AUDIT_BACKEND: "${TNT_AUDIT_BACKEND:-postgres}"
      TNT_KAFKA_BROKERS: "kafka:9092"
      TNT_KAFKA_TOPIC_AUDIT: "tnt-audit-events"
      TNT_KAFKA_CONSUMER_GROUP: "tnt-audit-pg-writer"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # control-plane:  # uncomment to run in Docker (currently running locally on port 3100)
  #   build:
  #     context: ./control-plane
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3100:3100"
  #   environment:
  #     VAULT_ADDR: "http://openbao:8200"
  #     VAULT_TOKEN: "dev-token"
  #     TNT_ENGINE_URL: "http://tnt-engine:8000"
  #     NEXTAUTH_URL: "http://localhost:3100"
  #     NEXTAUTH_SECRET: "dev-secret-change-me"
  #     AUTH_PROVIDER: "credentials"
  #     WATCHPACK_POLLING: "true"
  #     PG_HOST: "postgres"
  #     PG_PORT: "5432"
  #     REDIS_HOST: "redis"
  #     REDIS_PORT: "6379"
  #   volumes:
  #     - ./control-plane:/app
  #     - /app/node_modules
  #     - /app/.next
  #   depends_on:
  #     openbao:
  #       condition: service_started
  #     tnt-engine:
  #       condition: service_started

  # SoftHSM2 — only starts with: docker compose --profile hsm up
  softhsm:
    profiles: ["hsm"]
    build:
      context: .
      dockerfile: Dockerfile.softhsm
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    environment:
      SOFTHSM2_CONF: /etc/softhsm/softhsm2.conf

volumes:
  pgdata:
  softhsm-tokens:
  kafka-data:
