# Local development secrets — KHÔNG dùng cho staging/production
apiVersion: v1
kind: Secret
metadata:
  name: tnt-engine-secrets
  namespace: tnt-engine
  labels:
    environment: local
type: Opaque
stringData:
  TNT_DB_USER: "tnt"
  TNT_DB_PASSWORD: "tnt_secret"
  TNT_CRYPTO_TOKEN: "dev-token"
  TNT_ENVIRONMENT: "development"
  POSTGRES_DB: "tnt_engine"
  POSTGRES_USER: "tnt"
  POSTGRES_PASSWORD: "tnt_secret"
