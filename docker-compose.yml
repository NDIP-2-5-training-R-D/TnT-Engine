services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tnt_engine
      POSTGRES_USER: tnt
      POSTGRES_PASSWORD: tnt_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao:
    image: quay.io/openbao/openbao:latest
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-token
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      BAO_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200"
    command: server -dev
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  # T&T Engine — the Python app itself
  tnt-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      TNT_DB_HOST: postgres
      TNT_DB_PORT: "5432"
      TNT_DB_NAME: tnt_engine
      TNT_DB_USER: tnt
      TNT_DB_PASSWORD: tnt_secret
      TNT_REDIS_URL: "redis://redis:6379/0"
      TNT_CRYPTO_BASE_URL: "http://openbao:8200/v1"
      TNT_CRYPTO_TOKEN: "dev-token"
      TNT_VAULT_AUTH_METHOD: "static"
      TNT_CRYPTO_BACKEND: "openbao"
      TNT_CRYPTO_VERIFY_SSL: "false"
      TNT_ENVIRONMENT: "development"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # control-plane:  # uncomment to run in Docker (currently running locally on port 3100)
  #   build:
  #     context: ./control-plane
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3100:3100"
  #   environment:
  #     VAULT_ADDR: "http://openbao:8200"
  #     VAULT_TOKEN: "dev-token"
  #     TNT_ENGINE_URL: "http://tnt-engine:8000"
  #     NEXTAUTH_URL: "http://localhost:3100"
  #     NEXTAUTH_SECRET: "dev-secret-change-me"
  #     AUTH_PROVIDER: "credentials"
  #     WATCHPACK_POLLING: "true"
  #     PG_HOST: "postgres"
  #     PG_PORT: "5432"
  #     REDIS_HOST: "redis"
  #     REDIS_PORT: "6379"
  #   volumes:
  #     - ./control-plane:/app
  #     - /app/node_modules
  #     - /app/.next
  #   depends_on:
  #     openbao:
  #       condition: service_started
  #     tnt-engine:
  #       condition: service_started

  # SoftHSM2 — only starts with: docker compose --profile hsm up
  softhsm:
    profiles: ["hsm"]
    build:
      context: .
      dockerfile: Dockerfile.softhsm
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    environment:
      SOFTHSM2_CONF: /etc/softhsm/softhsm2.conf

volumes:
  pgdata:
  softhsm-tokens:
