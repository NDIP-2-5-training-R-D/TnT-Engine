version: "3.9"

services:
  tnt-engine:
    build: .
    container_name: tnt-engine
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
      - VAULT_TOKEN=mock-vault-token
      - CRYPTO_ADAPTER=mock
      - DB_ADAPTER=mock
    volumes:
      - ./app:/app/app
      - ./policies:/app/policies
    restart: unless-stopped
