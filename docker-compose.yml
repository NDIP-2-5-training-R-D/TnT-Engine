services:
  openbao:
    image: quay.io/openbao/openbao:2.0.0
    command: bao server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    networks:
      - tt-net
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  openbao-init:
    image: curlimages/curl:latest
    depends_on:
      openbao:
        condition: service_healthy
    volumes:
      - ./infra/openbao/init-scripts:/scripts
    command: sh -c "tr -d '\\015' < /scripts/01-init-openbao.sh > /tmp/init.sh && sh /tmp/init.sh"
    restart: on-failure
    networks:
      - tt-net

  crypto-adapter:
    build: .
    ports:
      - "8300:8300"
    depends_on:
      openbao:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - tt-net

networks:
  tt-net:
    driver: bridge
