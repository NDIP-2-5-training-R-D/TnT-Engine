---
# OpenBao chạy ở dev mode — in-memory, không cần unseal
# Token mặc định: dev-token
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: tnt-engine
  labels:
    app: openbao
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      containers:
        - name: openbao
          image: quay.io/openbao/openbao:latest
          args: ["server", "-dev"]
          ports:
            - containerPort: 8200
              name: api
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              value: "dev-token"
            - name: BAO_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: tnt-engine
  labels:
    app: openbao
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: 8200
      protocol: TCP
      name: api
  selector:
    app: openbao
