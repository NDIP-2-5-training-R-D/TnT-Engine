  #     VAULT_ADDR: "http://openbao:8200"
  #     VAULT_TOKEN: "dev-token"
  #     TNT_ENGINE_URL: "http://tnt-engine:8000"
  #     NEXTAUTH_URL: "http://localhost:3100"
